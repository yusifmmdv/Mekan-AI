services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mekan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mekan_local_only}
      POSTGRES_DB: mekan
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekan -d mekan"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-mekan_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-this-local-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [storage_data:/data]
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [storage]
    environment:
      STORAGE_ACCESS: ${S3_ACCESS_KEY_ID:-mekan_local}
      STORAGE_SECRET: ${S3_SECRET_ACCESS_KEY:-change-this-local-secret}
      STORAGE_BUCKET: ${S3_BUCKET:-mekan-private}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        until mc alias set local http://storage:9000 "$${STORAGE_ACCESS}" "$${STORAGE_SECRET}"; do sleep 2; done;
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}";
        mc anonymous set none "local/$${STORAGE_BUCKET}"
volumes:
  postgres_data:
  storage_data:
